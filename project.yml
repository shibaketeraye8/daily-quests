name: DailyQuests
options:
  bundleIdPrefix: com.dailyquests
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  DailyQuests:
    type: application
    platform: iOS
    sources:
      - path: DailyQuests
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dailyquests.hero
        PRODUCT_NAME: DailyQuests
        INFOPLIST_FILE: DailyQuests/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ONLY_ACTIVE_ARCH: NO
        VALIDATE_PRODUCT: NO

schemes:
  DailyQuests:
    build:
      targets:
        DailyQuests: all
    run:
      config: Debug
    archive:
      config: Release
